version: 2

models:
  - name: fact_sales
    description: Line-level sales fact table. One row per order and product combination.
    columns:
      - name: orderid
        description: Degenerate dimension for the order
        tests:
          - not_null
      - name: productkey
        description: Dimension key for dim_product
      - name: customerkey
        description: Dimension key for dim_customer
      - name: employeekey
        description: Dimension key for dim_employee
      - name: orderdatekey
        description: Role play order date key for dim_date
      - name: requireddatekey
        description: Role play required date key for dim_date
      - name: shippeddatekey
        description: Role play shipped date key for dim_date
      - name: quantity
        description: Quantity sold
      - name: unitprice
        description: Unit price on the order line
      - name: discount
        description: Discount on the order line
      - name: extendedamount
        description: Quantity times unit price before discount
      - name: discountedamount
        description: Quantity times unit price after discount